

name: Build XiaoZhangBen APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP_FILE" || { echo "Project ZIP not found"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          BUILD_FILE="$(find extracted -type f -path '*/app/build.gradle' | head -n 1)"
          test -n "$BUILD_FILE" || { echo "Android project not found in ZIP"; exit 1; }
          PROJECT_DIR="$(dirname "$(dirname "$BUILD_FILE")")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: XiaoZhangBen-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
